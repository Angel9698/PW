<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Angel Garcia</title>

    <link rel="stylesheet" href="contactstyles.css">
    <link rel="shortcut icon" href="images/favicon.ico">
</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>


    <!-- ========================================
         HEADER
    ======================================== -->

    <header class="site-header">

        <a
            class="logo"
            href="index.html"
            aria-label="Angel Garcia home"
        >
            <img
                id="logo"
                src="images/angel logo.png"
                alt=""
            >
        </a>

        <nav
            class="site-nav"
            aria-label="Primary navigation"
        >
            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a
                        class="contact-link"
                        href="contact.html"
                        aria-current="page"
                    >
                        Contact
                    </a>
                </li>

            </ul>
        </nav>

    </header>


    <!-- ========================================
         MAIN
    ======================================== -->

    <main
        id="main-content"
        tabindex="-1"
    >

        <section
            class="contact-section"
            aria-labelledby="contact-title"
        >

            <div class="contact-inner">


                <!-- ========================================
                     INTRO
                ======================================== -->

                <div class="contact-copy">

                    <p class="section-eyebrow">
                        Contact
                    </p>

                    <h1 id="contact-title">
                        Let's work together.
                    </h1>

                    <p
                        class="contact-description"
                        id="contact-description"
                    >
                        Have a role, project, or opportunity in mind?
                        Send me a message and I'll get back to you.
                    </p>

                </div>


                <!-- ========================================
                     FORM
                ======================================== -->

                <form
                    class="contact-form"
                    action="https://formspree.io/f/mpqvalww"
                    method="POST"
                    aria-label="Contact form"
                    aria-describedby="contact-description"
                >

                    <div class="form-field">

                        <label for="name">
                            Name
                        </label>

                        <input
                            id="name"
                            name="name"
                            type="text"
                            autocomplete="name"
                            required
                            aria-required="true"
                        >

                    </div>


                    <div class="form-field">

                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            aria-required="true"
                        >

                    </div>


                    <div class="form-field">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="7"
                            required
                            aria-required="true"
                        ></textarea>

                    </div>


                    <button
                        class="submit-button"
                        type="submit"
                    >
                        Send Message
                        <span aria-hidden="true">→</span>
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer class="site-footer">

        <div class="footer-inner">

            <div class="footer-bottom">

                <p>
                    © 2026 Angel Garcia
                </p>

            </div>

        </div>

    </footer>

</body>

</html>
